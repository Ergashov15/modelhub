# fly.toml app configuration file for ModelHub Qwen UI
# See https://fly.io/docs/reference/configuration/ for details

app = 'modelhub-qwen-sherzod'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = 'modelhub_data'
  destination = '/data'

[env]
  DATA_DIR = '/data'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
